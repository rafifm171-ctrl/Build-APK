name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python 3.12.9
        uses: actions/setup-python@v7
        with:
          python-version: "3.12.9"

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip curl build-essential \
            python3-pip python3-virtualenv \
            autoconf automake autopoint \
            libtool libltdl-dev pkg-config \
            zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            gettext

      - name: Install Rust
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install cython==0.29.34
          python -m pip install buildozer==1.6.0

      - name: Preflight check
        run: |
          echo "=== Python ==="
          python --version

          echo "=== Java ==="
          java -version

          echo "=== Buildozer ==="
          buildozer --version

          echo "=== Requirements ==="
          grep "^requirements" buildozer.spec

          echo "=== Python syntax check ==="
          python -m py_compile main.py

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Show APK
        run: |
          find bin -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Kalkulator-Serbaguna-APK
          path: bin/*.apk
          if-no-files-found: error
